[project]
name = "bricklogger"
version = "0.2.3"
description = "Data bridge for building automation: collects data based on a Brick model and writes it to time-series databases"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Rosenlund", email = "michael.rosenlund@cx1.dk" }]
requires-python = ">=3.11"
keywords = ["brick", "bacnet", "building-automation", "timescaledb", "data-logger"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # core
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # CLI
    "typer>=0.12",
    "httpx>=0.27",
    # API and web interface
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    # Brick model and working graph
    "rdflib>=7.0",
    "pyshacl>=0.30",
    "reasonable>=0.4",
    "pyoxigraph>=0.4",
    # plugins
    "bacpypes3>=0.0.90",
    "psycopg[binary]>=3.1",
    "mcp>=2.2.0",
    # plugin management: the requirements and markers read at `plugins remove`
    "packaging>=24",
]

[project.urls]
Homepage = "https://github.com/CX1-ApS/bricklogger"
Documentation = "https://cx1-aps.github.io/bricklogger/"
Source = "https://github.com/CX1-ApS/bricklogger"
Issues = "https://github.com/CX1-ApS/bricklogger/issues"

[project.scripts]
bricklogger = "bricklogger.cli:main"

[project.entry-points."bricklogger.sources"]
bacnet-ip = "bricklogger.plugins.bacnet_ip.declaration:SOURCE"

[project.entry-points."bricklogger.destinations"]
timescaledb = "bricklogger.plugins.timescaledb.declaration:DESTINATION"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "mkdocs-material>=9.7.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bricklogger"
module-root = "src"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["bacpypes3.*", "rdflib.*", "pyshacl.*", "reasonable.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
