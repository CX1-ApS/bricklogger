<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('login.title') }} · {{ t('wordmark') }}</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <header class="topbar"><span class="wordmark">{{ t('wordmark') }}</span></header>
  <main>
    <form class="login" method="post" action="/login">
      <h1>{{ t('login.title') }}</h1>
      <div class="field">
        <label for="password">{{ t('login.password') }}</label>
        <input id="password" name="password" type="password" autofocus autocomplete="current-password">
      </div>
      {% if wrong %}<p class="signal mono">{{ t('login.wrong') }}</p>{% endif %}
      <div class="button-row"><button class="button" type="submit">{{ t('login.submit') }}</button></div>
      <p class="dim">{{ t('login.hint') }}</p>
    </form>
  </main>
</body>
</html>
