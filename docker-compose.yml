name: bricklogger

services:
  daemon:
    image: ghcr.io/cx1-aps/bricklogger:0.2.0
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - config:/etc/bricklogger
      - data:/var/lib/bricklogger
      - plugins:/var/lib/bricklogger/plugins

  web:
    image: ghcr.io/cx1-aps/bricklogger:0.2.0
    command: ["bricklogger", "serve"]
    profiles: ["web"]
    depends_on: ["daemon"]
    network_mode: host
    restart: unless-stopped
    volumes:
      - config:/etc/bricklogger
      - data:/var/lib/bricklogger
      - plugins:/var/lib/bricklogger/plugins

  mcp:
    image: ghcr.io/cx1-aps/bricklogger:0.2.0
    command: ["bricklogger", "mcp", "serve", "--http"]
    profiles: ["mcp"]
    depends_on: ["daemon"]
    network_mode: host
    restart: unless-stopped
    volumes:
      - config:/etc/bricklogger
      - data:/var/lib/bricklogger
      - plugins:/var/lib/bricklogger/plugins

volumes:
  config:
  data:
  plugins:
